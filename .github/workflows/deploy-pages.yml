name: Publish Qin Lineup Lab


on:
  push:
    branches: [main]
  workflow_dispatch:


permissions:
  contents: read
  pages: write
  id-token: write


concurrency:
  group: pages
  cancel-in-progress: false


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare verified static website
        run: |
          mkdir -p _site
          unzip -q qin-lineup-lab-github-pages.zip -d _site
          test -f _site/index.html
          if [ -f _site/bench/index.json ]; then
            test -f _site/personal-worker.js
            test -f _site/app.css
          else
            if [ -f style-v2.css ]; then cp style-v2.css _site/; fi
            test -f _site/worker-v2.js
            test -f _site/benchmarks-v2/index.json
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

