name: Publish Qin Lineup Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare verified static website
        run: |
          mkdir -p _site
          for archive in qin-lineup-lab-data-*.zip qin-lineup-lab-github-pages.zip; do
            if [ -f "$archive" ]; then python3 -m zipfile -e "$archive" _site; fi
          done
          test -f _site/index.html
          test -f _site/bench/index.json
          test -f _site/web-data/manifest.json
          test -f _site/personal-worker.js
          test -f _site/app.css
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for Pages artifact to be indexed
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for attempt in {1..15}; do
            if gh api "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" \
              --jq '.artifacts[] | select(.expired == false) | .id' | grep -Fx "$ARTIFACT_ID"; then
              exit 0
            fi
            sleep 8
          done
          echo "::error::The uploaded Pages artifact is still missing from this run"
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
