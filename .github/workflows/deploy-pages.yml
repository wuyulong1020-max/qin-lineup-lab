name: Publish Qin Lineup Lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare verified static website
        run: |
          mkdir -p _site
          for archive in qin-lineup-lab-data-*.zip qin-lineup-lab-github-pages.zip; do
            if [ -f "$archive" ]; then unzip -q -o "$archive" -d _site; fi
          done
          test -f _site/index.html
          test -f _site/bench/index.json
          test -f _site/web-data/manifest.json
          test -f _site/personal-worker.js
          test -f _site/app.css
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
